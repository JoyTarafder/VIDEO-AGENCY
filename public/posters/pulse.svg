<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0f05"/>
      <stop offset="100%" stop-color="#040602"/>
    </linearGradient>
    <filter id="g"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
    <radialGradient id="vig" cx="50%" cy="50%" r="72%">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- generative waveform stack -->
  <g fill="none" stroke-linecap="round">
    <path d="M0 470 q200 -140 400 0 t400 0 t400 0 t400 0" stroke="#c8ff2e" stroke-width="6" opacity="0.9"/>
    <path d="M0 510 q200 -110 400 0 t400 0 t400 0 t400 0" stroke="#c8ff2e" stroke-width="4" opacity="0.5"/>
    <path d="M0 550 q200 -80 400 0 t400 0 t400 0 t400 0" stroke="#c8ff2e" stroke-width="3" opacity="0.3"/>
    <path d="M0 590 q200 -50 400 0 t400 0 t400 0 t400 0" stroke="#f2f0ea" stroke-width="2" opacity="0.2"/>
    <path d="M0 430 q200 -170 400 0 t400 0 t400 0 t400 0" stroke="#f2f0ea" stroke-width="2" opacity="0.25"/>
  </g>
  <g fill="#c8ff2e">
    <circle cx="400" cy="470" r="10"/>
    <circle cx="800" cy="470" r="10"/>
    <circle cx="1200" cy="470" r="10"/>
  </g>

  <text x="60" y="200" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="150" letter-spacing="10" fill="#f2f0ea">PULSE</text>
  <text x="64" y="256" font-family="Courier New, monospace" font-size="28" letter-spacing="12" fill="#c8ff2e">FESTIVAL TITLES — 2025</text>

  <text x="60" y="812" font-family="Courier New, monospace" font-size="26" letter-spacing="6" fill="#8f8e88">PULSE FESTIVAL — MOTION GRAPHICS</text>
  <text x="1540" y="812" text-anchor="end" font-family="Courier New, monospace" font-size="26" letter-spacing="6" fill="#8f8e88">TRT 0:45</text>

  <rect width="1600" height="900" fill="url(#vig)"/>
  <rect width="1600" height="900" filter="url(#g)" opacity="0.07"/>
  <rect width="1600" height="64" fill="#050505"/>
  <rect y="836" width="1600" height="64" fill="#050505"/>
</svg>
